name: Release

# Un tag de version poussé (git push origin vx.y.z) :
#   build → tag sur main, tests (unitaires, dont les justifications de permissions, + bout en bout du popup),
#           archives Chrome, Firefox et sources (artefact partagé), paquets vérifiés (verify:build),
#           build Firefox depuis l'archive des sources identique à l'archive Firefox (relecture AMO)
#   chrome → envoi + soumission au Chrome Web Store
#   firefox → envoi + soumission sur Firefox Add-ons (AMO), en parallèle
#   github-release → release GitHub avec les trois archives, si le Chrome Web Store a accepté la version
# Chaque store publie automatiquement la version après son examen. Voir docs/STORE.md › 7.
on:
  push:
    tags: ['v*.*.*']

# Aucun droit par défaut : chaque job déclare le strict nécessaire
permissions: {}

# Jamais deux publications en parallèle ; une publication en cours n'est pas interrompue
concurrency:
  group: release
  cancel-in-progress: false

env:
  # ID public de l'élément sur le Chrome Web Store
  EXTENSION_ID: khokcmigioggannjoojambdgioigdceb
  # ID Gecko (browser_specific_settings.gecko.id) : identifie le module sur AMO
  AMO_ADDON_ID: synckai@sync-kai.github.io

jobs:
  build:
    name: Tests et archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Historique complet : contrôle d'ascendance avec origin/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag sur main
        run: |
          commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME ($commit) n'est pas sur main : publication refusée (voir docs/STORE.md › 7)."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME ($commit) contenu dans origin/main."

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Version du tag = package.json = manifest.json
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"
          echo "Tag : $tag_version · package.json : $pkg_version · manifest.json : $manifest_version"
          if [ "$tag_version" != "$pkg_version" ] || [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Versions incohérentes (tag $tag_version, package.json $pkg_version, manifest.json $manifest_version)."
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      # Aucun script d'installation (ni le téléchargement de Chrome par puppeteer) : versions du lockfile uniquement
      - run: npm ci --ignore-scripts

      # Dont scripts/store-permissions.test.ts : une permission sans justification bloque l'envoi aux stores
      - name: Tests
        run: npx vitest run

      # Build épinglé par puppeteer (lockfile), jamais « latest » : un échec bloque l'envoi aux stores
      - name: Chrome headless pour Puppeteer
        run: npx --no-install puppeteer browsers install chrome-headless-shell@pinned

      - name: Tests de bout en bout
        run: npm run test:e2e

      # Types des scripts + builds de production → release/synckai-<version>-{chrome,firefox,source}.zip
      # (Chrome sans le champ key ; sources = git archive du tag, avec BUILD.md et .source-date-epoch)
      - name: Archives
        run: npm run package:all

      - name: web-ext lint (Firefox)
        run: npm run lint:firefox

      # dist/ et dist-firefox/ (construits par package:all) : fichiers référencés, web_accessible_resources,
      # IIFE Netflix, permissions, budgets des scripts de contenu
      - name: Vérification des paquets construits
        run: npm run verify:build

      # Ce que fait le relecteur AMO : archive des sources décompressée dans un autre dossier, build sans
      # SOURCE_DATE_EPOCH (horodatage lu dans .source-date-epoch), comparaison avec l'archive Firefox envoyée.
      # Le moindre écart bloque l'envoi aux deux stores.
      - name: Build Firefox reproductible depuis l'archive des sources
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          repro="$(mktemp -d)"
          unzip -q "release/synckai-$VERSION-source.zip" -d "$repro/source"
          unzip -q "release/synckai-$VERSION-firefox.zip" -d "$repro/submitted"
          (cd "$repro/source" && env -u SOURCE_DATE_EPOCH npm ci --ignore-scripts --no-audit --no-fund && env -u SOURCE_DATE_EPOCH npm run build:firefox)
          diff -r "$repro/submitted" "$repro/source/dist-firefox"
          echo "Archive Firefox identique au build depuis l'archive des sources."

      - name: Notes de version
        run: node scripts/changelog-notes.ts "${{ steps.version.outputs.version }}" > release/notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

  chrome:
    name: Chrome Web Store
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets des stores : environnement réservé aux tags v* (docs/STORE.md › 7, configuration GitHub)
    environment: stores
    permissions:
      contents: read
    steps:
      # package.json + package-lock.json seulement (fichiers racine du mode cone) : CLI à version exacte
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Identifiants du Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          missing=""
          [ -n "$CLIENT_ID" ] || missing="$missing CWS_CLIENT_ID"
          [ -n "$CLIENT_SECRET" ] || missing="$missing CWS_CLIENT_SECRET"
          [ -n "$REFRESH_TOKEN" ] || missing="$missing CWS_REFRESH_TOKEN"
          [ -n "$PUBLISHER_ID" ] || missing="$missing CWS_PUBLISHER_ID"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing (Settings › Secrets and variables › Actions, voir docs/STORE.md)."
            exit 1
          fi

      # chrome-webstore-upload-cli (devDependency à version exacte) : jamais résolu sur le registre au moment du run.
      # Sans sous-commande, la CLI envoie l'archive puis la soumet (DEFAULT_PUBLISH : mise en ligne
      # automatique dès la validation). Elle lit CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN, PUBLISHER_ID.
      # « does not meet the requirements » : justification manquante dans l'onglet Confidentialité (docs/STORE.md › 7).
      - name: Envoi + soumission
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          npx --no-install chrome-webstore-upload
          --source "release/synckai-$VERSION-chrome.zip"
          --extension-id "$EXTENSION_ID"

  firefox:
    name: Firefox Add-ons (AMO)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stores
    permissions:
      contents: read
    steps:
      # docs/store/amo-metadata.json, plus package.json + package-lock.json (fichiers racine du mode cone)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/store
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # web-ext du lockfile (le même que pour web-ext lint)
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Identifiants AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          missing=""
          [ -n "$AMO_JWT_ISSUER" ] || missing="$missing AMO_JWT_ISSUER"
          [ -n "$AMO_JWT_SECRET" ] || missing="$missing AMO_JWT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing (Settings › Secrets and variables › Actions, voir docs/STORE.md)."
            exit 1
          fi

      # L'API (PUT addon/<guid>) applique les champs de fiche à chaque envoi : la fiche complète n'est
      # envoyée que tant que le module n'est pas public (première soumission), pour ne pas écraser
      # ensuite les modifications faites à la main sur AMO. Les versions suivantes ne reçoivent
      # que les métadonnées de version (licence, notes pour les relecteurs).
      # 200 : public ; 401/403/404 : absent ou non public ; tout autre code (5xx, 429, délai dépassé) : échec,
      # pour ne jamais renvoyer la fiche complète sur une panne passagère (Re-run failed jobs ensuite).
      - name: Métadonnées AMO
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 \
            "https://addons.mozilla.org/api/v5/addons/addon/$AMO_ADDON_ID/")" || status="000"
          case "$status" in
            200)
              jq '{version: .version}' docs/store/amo-metadata.json > amo-metadata.json
              echo "Module public sur AMO : métadonnées de version uniquement." ;;
            401|403|404)
              cp docs/store/amo-metadata.json amo-metadata.json
              echo "Module absent ou non public sur AMO (HTTP $status) : fiche complète envoyée." ;;
            *)
              echo "::error::Statut AMO indéterminé (HTTP $status) : envoi annulé, relancer le job (Re-run failed jobs)."
              exit 1 ;;
          esac

      # web-ext sign reconstruit le .zip à partir d'un dossier : on lui donne le paquet Firefox décompressé,
      # identique à l'archive jointe à la release. --approval-timeout 0 : soumission sans attendre l'examen
      # (la version est publiée par AMO une fois approuvée). Identifiants lus dans WEB_EXT_API_KEY / _SECRET.
      - name: Envoi + soumission (canal listed)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          unzip -q "release/synckai-$VERSION-firefox.zip" -d amo-package
          npx --no-install web-ext sign \
            --no-config-discovery \
            --source-dir amo-package \
            --artifacts-dir web-ext-artifacts \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --upload-source-code "release/synckai-$VERSION-source.zip" \
            --approval-timeout 0

  github-release:
    name: Release GitHub
    needs: [build, chrome, firefox]
    # Publiée dès que le Chrome Web Store a accepté la version, même si AMO a échoué (statut dans les notes)
    if: always() && needs.build.result == 'success' && needs.chrome.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Statut des stores
        env:
          FIREFOX_RESULT: ${{ needs.firefox.result }}
        run: |
          case "$FIREFOX_RESULT" in
            success) firefox="soumis pour examen" ;;
            failure) firefox="échec, nouvel envoi à venir" ;;
            *) firefox="non soumis" ;;
          esac
          printf '\n---\n\nChrome Web Store : soumis pour examen · Firefox (AMO) : %s\n' "$firefox" >> release/notes.md
          if [ "$FIREFOX_RESULT" != "success" ]; then
            echo "::warning::Firefox (AMO) : $FIREFOX_RESULT. La release GitHub est créée quand même (voir docs/STORE.md › 7)."
          fi

      # Idempotent : une release existante (créée à la main, ou run relancé) est mise à jour
      # (titre, notes, archives remplacées) au lieu de faire échouer le job
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          assets=(
            "release/synckai-$VERSION-chrome.zip"
            "release/synckai-$VERSION-firefox.zip"
            "release/synckai-$VERSION-source.zip"
          )
          if view_error="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1 >/dev/null)"; then
            echo "Release $GITHUB_REF_NAME existante : notes et archives mises à jour."
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "SyncKai $VERSION" --notes-file release/notes.md
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          elif [[ "$view_error" == *"release not found"* ]]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "SyncKai $VERSION" --notes-file release/notes.md --verify-tag
          else
            echo "::error::gh release view a échoué : $view_error"
            exit 1
          fi
