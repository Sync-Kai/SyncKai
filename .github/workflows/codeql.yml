name: CodeQL

# Analyse statique (SAST) du code JavaScript / TypeScript, requêtes par défaut : alertes dans
# Security › Code scanning. Audit 2026-10-15 (5-security-quality.md › 3.8, point 4), gratuit pour un dépôt public.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Chaque lundi à 05:17 UTC : nouvelles requêtes CodeQL appliquées au code inchangé
    - cron: '17 5 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Envoi des résultats SARIF dans Code scanning
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none : sources analysées sans build ni npm ci (aucune dépendance installée)
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
