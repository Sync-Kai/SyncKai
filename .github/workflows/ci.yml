name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Un seul run par branche / PR : un nouveau push annule le précédent
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Aucun script d'installation : pas de navigateur téléchargé par puppeteer, versions du lockfile uniquement
      - run: npm ci --ignore-scripts

      # Mêmes vérifications que `npm run verify` en local, en étapes séparées
      - name: Types (extension, scripts, captures, e2e)
        run: npm run typecheck

      # Lint typé : promesses non gérées, async mal placées, switch non exhaustifs, any
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Build Firefox + web-ext lint
        run: npm run build:firefox && npm run lint:firefox

      # Paquets construits : fichiers référencés, web_accessible_resources, IIFE Netflix, permissions, budgets
      - name: Vérification des paquets construits
        run: npm run verify:build

      # Comme le relecteur AMO : archive des sources décompressée ailleurs, build sans SOURCE_DATE_EPOCH
      # (horodatage lu dans .source-date-epoch), puis comparaison avec le build Firefox du dépôt
      - name: Build Firefox reproductible depuis l'archive des sources
        run: |
          npm run package:source
          repro="$(mktemp -d)/synckai-source"
          unzip -q release/synckai-*-source.zip -d "$repro"
          (cd "$repro" && env -u SOURCE_DATE_EPOCH npm ci --ignore-scripts --no-audit --no-fund && env -u SOURCE_DATE_EPOCH npm run build:firefox)
          diff -r dist-firefox "$repro/dist-firefox"
          echo "Build Firefox identique depuis l'archive des sources ($repro)."

  e2e:
    name: Tests de bout en bout (popup)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Chrome headless (shell) utilisé par Puppeteer, dans ~/.cache/puppeteer : build épinglé par puppeteer (lockfile)
      - name: Chrome headless pour Puppeteer
        run: npx --no-install puppeteer browsers install chrome-headless-shell@pinned

      - name: Tests de bout en bout
        run: npm run test:e2e

  # Mise en page des 21 langues (popup, panneau à 360 / 320 px, page d'import) : informatif, jamais bloquant.
  # Une traduction trop longue ne doit ni bloquer une fusion ni une release (voir CLAUDE.md › i18n) : le job reste
  # vert, un avertissement signale les anomalies, le rapport s'affiche dans le résumé du run et les captures annotées
  # sont jointes en artefact. Police de secours de Linux plus large que celle de Windows : les anomalies trouvées ici
  # sont réelles pour les utilisateurs Linux / macOS.
  i18n-layout:
    name: Mise en page des langues (informatif)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Chrome headless pour Puppeteer
        run: npx --no-install puppeteer browsers install chrome-headless-shell@pinned

      - name: Contrôle de mise en page
        id: layout
        continue-on-error: true
        env:
          SYNCKAI_I18N_LAYOUT_DIR: ${{ runner.temp }}/i18n-layout
        run: npm run test:i18n-layout

      - name: Rapport
        if: always()
        env:
          SYNCKAI_I18N_LAYOUT_DIR: ${{ runner.temp }}/i18n-layout
          OUTCOME: ${{ steps.layout.outcome }}
        run: |
          report="$SYNCKAI_I18N_LAYOUT_DIR/report.md"
          if [ ! -f "$report" ]; then
            echo "::warning::i18n layout report missing: the check did not run to the end."
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          summary=$(grep -m1 -E '^\*\*[0-9]+ findings?\*\*' "$report" | tr -d '*' || true)
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning title=i18n layout::${summary:-findings} — see the run summary and the i18n-layout artifact."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: i18n-layout
          path: ${{ runner.temp }}/i18n-layout
          if-no-files-found: ignore
          retention-days: 14

  # Couverture des tests unitaires en cliquet (décision 5 de l'audit 2026-10-15) : seuils de vitest.config.ts
  # (branches, instructions, fonctions, lignes), le job échoue seulement si l'une des valeurs baisse.
  # Une hausse durable se reporte à la main dans vitest.config.ts. Résumé des valeurs dans celui du run.
  coverage:
    name: Couverture (cliquet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Tests avec couverture
        run: npm run coverage -- --coverage.reportsDirectory="$RUNNER_TEMP/coverage"

      - name: Résumé
        if: always()
        run: |
          summary="$RUNNER_TEMP/coverage/coverage-summary.json"
          if [ ! -f "$summary" ]; then
            echo "::warning::Coverage summary missing: the tests did not run to the end."
            exit 0
          fi
          jq -r '.total | "| Coverage | % |\n|---|---|\n| Branches | \(.branches.pct) |\n| Statements | \(.statements.pct) |\n| Functions | \(.functions.pct) |\n| Lines | \(.lines.pct) |"' "$summary" >> "$GITHUB_STEP_SUMMARY"

  # Extension construite dans un vrai Chromium (npm run test:ext, scripts/ext-e2e) : informatif (décision 4 de
  # l'audit 2026-10-15), sur les pushs vers develop seulement ; à rendre requis dans release.yml après deux semaines
  # stables. Chrome for Testing épinglé par puppeteer (lockfile) : le Chrome de marque ignore --load-extension depuis
  # la 137 et chrome-headless-shell ne charge pas les extensions. Headless, pas de serveur X ; CI=true (GitHub)
  # ajoute --no-sandbox (scripts/ext-e2e/harness.ts). Captures des pages en échec jointes en artefact.
  test-ext:
    name: Extension réelle (test:ext, informatif)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Chemin de l'exécutable : dernière ligne de la sortie (--format), passé au harnais par SYNCKAI_EXT_CHROME
      - name: Chrome for Testing pour Puppeteer
        run: |
          chrome="$(npx --no-install puppeteer browsers install chrome@pinned --format '{{path}}' | tail -n 1)"
          if [ ! -x "$chrome" ]; then
            echo "::error::Chrome for Testing not found after install (got: $chrome)."
            exit 1
          fi
          echo "SYNCKAI_EXT_CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Tests de l'extension réelle
        env:
          SYNCKAI_EXT_E2E_DIR: ${{ runner.temp }}/ext-e2e
        run: npm run test:ext

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-ext-failures
          path: ${{ runner.temp }}/ext-e2e/**/failure/*.png
          if-no-files-found: ignore
          retention-days: 14
