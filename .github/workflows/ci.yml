name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Un seul run par branche / PR : un nouveau push annule le précédent
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Aucun script d'installation : pas de navigateur téléchargé par puppeteer, versions du lockfile uniquement
      - run: npm ci --ignore-scripts

      - name: Types (extension)
        run: npx tsc --noEmit

      - name: Types (scripts)
        run: npx tsc --noEmit -p scripts

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Build Firefox + web-ext lint
        run: npm run build:firefox && npm run lint:firefox

  e2e:
    name: Tests de bout en bout (popup)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Chrome headless (shell) utilisé par Puppeteer, dans ~/.cache/puppeteer : build épinglé par puppeteer (lockfile)
      - name: Chrome headless pour Puppeteer
        run: npx --no-install puppeteer browsers install chrome-headless-shell@pinned

      - name: Tests de bout en bout
        run: npm run test:e2e
